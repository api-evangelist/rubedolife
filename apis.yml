name: Rubedo Life Sciences
description: Rubedo Life Sciences is a clinical-stage biotechnology company discovering
  and developing precision medicines that target the biological drivers of aging and
  age-related diseases. Its proprietary ALEMBIC drug-discovery platform identifies
  and validates senescent ("zombie") cells that accumulate with age and drive chronic
  disease, enabling the design of selective senolytic therapeutics. The company's lead
  candidate, RLS-1496, is a first-in-class selective GPX4 modulator that has produced
  positive Phase 1 dermatology results (plaque psoriasis, atopic dermatitis, skin
  aging) and Phase 1b/2a data in actinic keratosis. Rubedo is backed by Khosla Ventures
  and operates as a therapeutics company rather than a software/API provider — this
  profile carries no developer or API surface.
